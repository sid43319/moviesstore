{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>Report Review</h2>
        <hr />

        <p><b>User:</b> {{ template_data.review.user.username}}</p>
            <p><b>Review:</b>  {{ template_data.review.comment }}</p>

        <p><i>Warning! Your report will result in removal of this review.</i></p>

        <form method="POST">
          {% csrf_token %}
            <button type="submit" class="btn btn-warning"> Report Review </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
